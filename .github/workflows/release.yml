# Builds installers for macOS (arm64 + x64), Windows (x64) and Linux (x64), plus the web/PWA
# bundle. Tag `vX.Y.Z` to publish a draft GitHub release; run manually for test builds.
# Signing is optional: without the secrets below you get unsigned (ad-hoc on macOS) builds.
#   macOS:   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, MAC_IDENTITY, APPLE_ID,
#            APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CERT_P12_BASE64, WIN_CERT_PASSWORD
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-22.04
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Skip onnxruntime-node's optional CUDA download; the app uses the bundled CPU/DirectML builds.
      - run: npm ci --onnxruntime-node-install=skip
      - name: Signing configuration
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_IDENTITY: ${{ secrets.MAC_IDENTITY }}
          WIN_CERT: ${{ secrets.WIN_CERT_P12_BASE64 }}
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CERT" ]; then
            EXTRA="-c.mac.identity=\"$MAC_IDENTITY\" -c.mac.hardenedRuntime=true -c.mac.entitlements=build/entitlements.mac.plist -c.mac.entitlementsInherit=build/entitlements.mac.plist -c.mac.notarize=true"
            echo "CSC_LINK=$MAC_CERT" >> "$GITHUB_ENV"
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CERT" ]; then echo "CSC_LINK=$WIN_CERT" >> "$GITHUB_ENV"; fi
          echo "BUILDER_EXTRA=$EXTRA" >> "$GITHUB_ENV"
      - name: Build installers
        shell: bash
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 && 'true' || 'false' }}
        run: npm run ${{ matrix.script }} -- $BUILDER_EXTRA --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: removeless-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --onnxruntime-node-install=skip && npm run build:web
      - uses: actions/upload-artifact@v4
        with: { name: removeless-web, path: dist }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, web]
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/removeless-*/*
